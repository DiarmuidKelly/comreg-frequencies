name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy supersedes an in-flight one; never cancel a run mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit

      # `npm run build` normalises data/raw first, and data/raw is committed, so
      # the build never depends on ComReg's API being up.
      - name: Build site
        # A project page is served from /<repo>/, so the asset base must match.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      # `enablement` lets the first run turn Pages on itself, rather than
      # failing until someone sets it by hand in the repository settings.
      # Needs the repo to be public, or the account to be on GitHub Pro.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
